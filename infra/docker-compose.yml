services:
  postgres:
    # Local development database for Phase 2 readiness.
    # NO real schema and NO real secrets — dev-only placeholder credentials.
    image: postgres:18-alpine
    container_name: ibo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibo
      POSTGRES_PASSWORD: ibo_dev_only_password
      POSTGRES_DB: ibo
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ stores data in a subdirectory of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ibo -d ibo']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: ibo-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      IBO_BACKEND_VERSION: 0.1.0
      # Dev-only connection string (placeholder credentials, no real secret)
      DATABASE_URL: postgres://ibo:ibo_dev_only_password@postgres:5432/ibo
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
